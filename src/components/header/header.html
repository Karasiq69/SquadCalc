<div class="krestgg-logo-link animate__animated animate__fadeIn" style="width:100vw; padding-top:.5em; z-index:1; text-align:center; pointer-events:none; position:absolute; left:0;">
    <a href="https://krestgg.ru/" target="_blank" title="KrestGG" style="pointer-events:auto;">
        <img src="../../img/krestgg-logo.svg" alt="KrestGG Logo" style="height: 50px;">
    </a>
</div>

<header class="pure-g" oncontextmenu="return false;">

    <div class="pure-u-1 pure-u-md-1-5 mapSelector">
        <div id="mapSelector" class="dropdown animate__animated animate__fadeIn">
            <select class="dropbtn unselectable" tabindex="-1"></select>
        </div>
        <div id="layerSelector" class="dropdown animate__animated animate__fadeIn">
            <select class="dropbtn5 unselectable" tabindex="-1"></select>
        </div>
    </div>
    <div class="pure-u-1 pure-u-md-1-5 weaponSelector animate__animated animate__fadeIn">
        <div id="weaponSelector" class="dropdown">
            <select class="dropbtn2 unselectable" tabindex="-1"></select>
        </div>
        <div id="ammoSelector" class="dropdown animate__animated animate__fadeIn">
            <select class="dropbtn3 unselectable" tabindex="-1">
                <option data-i18n="weapons:impact" value="0">impact</option>
                <option data-i18n="weapons:nearSurface" value="1">near-surface</option>
            </select>
        </div>
    </div>
    
</header>


<div id="loader" class="pure-g">
    <span id="loaderLogo" class="animate__animated animate__fadeIn">
        <img src="../../img/crosses.svg" alt="KrestGG Logo" style="height: 90px; display: block; margin: 0 auto;">
        <span data-i18n="common:squad">SQUAD</span>
        <span data-i18n="common:calc">CALC</span>
    </span>
</div>
