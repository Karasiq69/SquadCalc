# Rate limiting (http-контекст, conf.d инклудится из http)
limit_req_zone $binary_remote_addr zone=api:10m rate=55r/s;

# WebSocket upgrade map: выставляет Connection: upgrade только если клиент шлёт Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # --- Блокировка сканер-ботов ---
    location ~* ^/(wp-login|wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|admin|cgi-bin) {
        return 444;
    }

    location ~* \.(env|git|svn|bak|old|sql|log)$ {
        return 444;
    }

    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zgrab|python-requests|Go-http-client|curl/|wget/)) {
        return 444;
    }

    # --- API reverse proxy (HTTP + WebSocket) ---
    location /api/ {
        limit_req zone=api burst=25 nodelay;
        limit_req_status 429;
        proxy_pass https://squadcalc.app/api/;
        proxy_set_header Host squadcalc.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived WS connections (squad-сессии могут идти часами)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Статика ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}